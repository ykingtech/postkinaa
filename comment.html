<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        /* ============================================================
            STYLES
        ============================================================ */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-out; }

        .comment-card {
            transition: all 0.3s ease;
        }

        .comment-card:hover {
            transform: translateX(5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }
        
        /* Glass effect for context menu */
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .reaction-btn {
            background-color: #f3f4f6; /* Default gray background for unreacted */
        }
        .reaction-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="comment-context-menu" 
         class="absolute glass-effect shadow-xl rounded-lg border border-gray-200 z-50 py-1 hidden">
        <button id="edit-comment-btn" 
                class="w-full text-left px-4 py-2 text-sm text-gray-800 hover:bg-purple-50">
            පණිවිඩය සංස්කරණය කරන්න

        <button id="delete-comment-btn" 
                class="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50">

    <header id="appHeader" class="bg-white/80 backdrop-blur-lg border-b border-purple-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent" id="headerTitle">
                💬 කමෙන්ට්
            </h1>
            <button onclick="goBackToHome()" id="backButton" class="px-4 py-2 bg-purple-500 text-white rounded-full text-sm font-semibold hover:bg-purple-600 transition-colors">
                පිටුපසට
            </button>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4 py-6">
        
        <div id="mainPostContainer" class="bg-white/90 backdrop-blur-lg rounded-3xl shadow-xl border border-purple-100 p-6 mb-8 fade-in">
            <div id="mainPostContent">
                <p class="text-gray-500 text-center">පෝස්ට් එක පූරණය වෙමින්...</p>
            </div>
        </div>

        <div id="commentInputSection" class="bg-white/90 backdrop-blur-lg rounded-3xl shadow-xl border border-pink-100 p-6 mb-8">
            <h3 class="text-xl font-bold text-gray-700 mb-4" id="commentInputHeader">ඔබේ කමෙන්ටුව</h3>
            <textarea
                id="commentInput"
                placeholder="කමෙන්ටුව මෙතන ලියන්න..."
                class="w-full px-4 py-3 bg-gray-50 rounded-2xl border-2 border-transparent focus:border-pink-400 focus:bg-white outline-none resize-none transition-all duration-200"
                rows="2"
            ></textarea>
            <div class="flex justify-end mt-4">
                <button
                    onclick="handleCommentSubmission()"
                    id="commentButton"
                    class="px-6 py-2.5 bg-gradient-to-r from-pink-500 to-red-500 text-white rounded-full font-semibold hover:from-pink-600 hover:to-red-600 shadow-lg transition-all duration-200"
                >
                    💬 කමෙන්ට් කරන්න
                </button>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-4">සියලු කමෙන්ට්</h2>
        <div id="commentsFeed" class="space-y-4">
            </div>

        <div id="noCommentsMessage" class="text-center py-8 text-gray-500" style="display: none;">
            තවම කමෙන්ට් නෑ.
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentPostId = null;
        let currentPostAuthorId = null; 
        let isEditingComment = false;
        let editingCommentKey = null;

        // Firebase Configuration (Use your configuration)
        const firebaseConfig = {
            apiKey: "AIzaSyAzNJ-P8aAMvTuNWKcQYCjIIHiaL0BpdZ0",
            authDomain: "game-f1c21.firebaseapp.com",
            databaseURL: "https://game-f1c21-default-rtdb.firebaseio.com",
            projectId: "game-f1c21",
            storageBucket: "game-f1c21.firebasestorage.app",
            messagingSenderId: "656338565711",
            appId: "1:656338565711:web:395f9c7f846588b065883a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const postsRef = database.ref("posts");
        const usersRef = database.ref("users");
        const notificationsRef = database.ref("notifications"); 

        // Theme Definitions (unchanged)
        const THEMES = {
            default: {
                bg: 'bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50',
                header: 'from-purple-600 via-pink-600 to-blue-600',
                button: 'from-pink-500 to-red-500', 
                buttonHover: 'hover:from-pink-600 hover:to-red-600',
                settingBackBG: '#9333ea', 
            },
            blue: {
                bg: 'bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50',
                header: 'from-blue-600 via-indigo-600 to-purple-600',
                button: 'from-blue-500 to-indigo-500',
                buttonHover: 'hover:from-blue-600 hover:to-indigo-600',
                settingBackBG: '#3b82f6',
            },
            green: {
                bg: 'bg-gradient-to-br from-green-50 via-teal-50 to-cyan-50',
                header: 'from-green-600 via-teal-600 to-cyan-600',
                button: 'from-green-500 to-teal-500',
                buttonHover: 'hover:from-green-600 hover:to-teal-600',
                settingBackBG: '#10b981',
            },
            dark: {
                bg: 'bg-gray-800',
                header: 'text-white', 
                button: 'from-gray-600 to-gray-700',
                buttonHover: 'hover:from-gray-700 hover:to-gray-800',
                settingBackBG: '#4b5563',
            },
            red: {
                bg: 'bg-gradient-to-br from-red-50 via-pink-50 to-orange-50',
                header: 'from-red-600 via-pink-600 to-orange-600',
                button: 'from-red-500 to-pink-500',
                buttonHover: 'hover:from-red-600 hover:to-pink-600',
                settingBackBG: '#ef4444',
            },
            yellow: {
                bg: 'bg-gradient-to-br from-yellow-50 via-amber-50 to-orange-50',
                header: 'from-yellow-600 via-amber-600 to-orange-600',
                button: 'from-yellow-500 to-amber-500',
                buttonHover: 'hover:from-yellow-600 hover:to-amber-600',
                settingBackBG: '#f59e0b',
            },
            teal: {
                bg: 'bg-gradient-to-br from-teal-50 via-cyan-50 to-blue-50',
                header: 'from-teal-600 via-cyan-600 to-blue-600',
                button: 'from-teal-500 to-cyan-500',
                buttonHover: 'hover:from-teal-600 hover:to-cyan-500',
                settingBackBG: '#14b8a6',
            }
        };

        function applyTheme() {
            const themeName = localStorage.getItem('appTheme') || 'default';
            const theme = THEMES[themeName] || THEMES.default;

            document.body.className = 'min-h-screen ' + theme.bg;
            const headerTitle = document.getElementById('headerTitle');
            const backButton = document.getElementById('backButton');
            const commentButton = document.getElementById('commentButton');

            // 1. Update Header Title
            headerTitle.classList.remove('text-transparent', 'text-white');
            headerTitle.className = headerTitle.className.replace(/bg-gradient-to-r from-.*?to-.*?/g, ''); 
            
            if (themeName === 'dark') {
                headerTitle.classList.add('text-white');
            } else {
                headerTitle.classList.add('bg-clip-text', 'text-transparent', 'bg-gradient-to-r', ...theme.header.split(' '));
            }

            // 2. Update Back Button
            backButton.style.backgroundColor = theme.settingBackBG;
            backButton.classList.remove('bg-purple-500', 'hover:bg-purple-600'); 
            
            // 3. Update Comment Button
            commentButton.classList.remove('from-pink-500', 'to-red-500', 'hover:from-pink-600', 'hover:to-red-600');
            commentButton.classList.add('bg-gradient-to-r', ...theme.button.split(' '));
            commentButton.classList.add(...theme.buttonHover.split(' '));
            
            // 4. Update Header Background for Dark Mode
            const header = document.getElementById('appHeader');
            if (themeName === 'dark') {
                header.className = 'bg-gray-700/80 backdrop-blur-lg border-b border-gray-600 sticky top-0 z-50 shadow-sm';
            } else {
                header.className = 'bg-white/80 backdrop-blur-lg border-b border-purple-100 sticky top-0 z-50 shadow-sm';
            }
        }


        function goBackToHome() {
            localStorage.setItem(`refreshPost_${currentPostId}`, 'true');
            window.location.href = `Home.html?highlightPost=${currentPostId}`;
        }
        
        function scrollToCommentInput() {
            const inputSection = document.getElementById('commentInputSection');
            inputSection.scrollIntoView({ behavior: 'smooth' });
            document.getElementById('commentInput').focus();
        }

        // Notification Utility
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50 fade-in';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateY(10px)';
                notification.addEventListener('transitionend', () => notification.remove());
            }, 3000);
        }

        // 🔥 REACTION LOGIC (UNCHANGED)
        function createNotification(type, recipientId, postId, content = null) {
            if (!currentUser || currentUser.uid === recipientId) {
                return; 
            }

            const newNotificationKey = notificationsRef.child(recipientId).push().key;

            const notificationData = {
                type: type, 
                actorId: currentUser.uid,
                postId: postId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                read: false
            };

            if (content) {
                notificationData.content = content.substring(0, 100); 
            }

            const updates = {};
            updates[`/notifications/${recipientId}/${newNotificationKey}`] = notificationData;

            database.ref().update(updates)
                .catch(error => console.error("Error creating notification:", error));
        }

        function toggleSingleReaction(postId, newReactionType) {
            if (!currentUser) {
                showNotification("Like/Reaction කිරීමට පිවිසෙන්න.");
                return;
            }

            const uid = currentUser.uid;
            const postReactionsRef = postsRef.child(postId).child("reactions");
            const userReactionRef = postReactionsRef.child(uid);
            const countsRef = postsRef.child(postId).child("reactionCounts");

            // Fetch current reaction
            userReactionRef.once("value").then(snap => {
                const currentReaction = snap.val();
                const updates = {};

                if (currentReaction === newReactionType) {
                    // 1. Remove Reaction
                    updates[`posts/${postId}/reactions/${uid}`] = null;
                    
                    // 2. Decrement count using transaction
                    countsRef.child(newReactionType).transaction(count => (count || 1) - 1);
                    showNotification(`'${newReactionType}' ඉවත් කරන ලදි. 💔`);
                } else {
                    // 1. If existing reaction is present, decrement its count
                    if (currentReaction) {
                        countsRef.child(currentReaction).transaction(count => (count || 1) - 1);
                    }

                    // 2. Set new reaction
                    updates[`posts/${postId}/reactions/${uid}`] = newReactionType;
                    
                    // 3. Increment count for new reaction
                    countsRef.child(newReactionType).transaction(count => (count || 0) + 1);

                    // 4. Send Notification
                    showNotification(`'${newReactionType}' එකතු කරන ලදි! 🎉`);
                    createNotification(newReactionType, currentPostAuthorId, postId);
                }
                
                // Perform the updates (setting/removing reaction entry)
                return database.ref().update(updates);
            }).catch(error => {
                 console.error("Reaction Error:", error);
                 showNotification("ප්‍රතිචාර දැක්වීමේ දෝෂයක්. ❌");
            });
        }
        
        // 🔥 NEW: Function to dynamically update DOM elements for reactions
        function updateReactionDOM(postId, reactionCounts, myReaction) {
            const postContainer = document.getElementById('mainPostContent');
            if (!postContainer) return;

            // Define reaction types and their active colors
            const reactionMap = [
                { type: 'heart', active: 'from-pink-200 to-red-200 text-red-600' },
                { type: 'like', active: 'from-red-100 to-pink-100 text-pink-600' },
                { type: 'laugh', active: 'from-yellow-100 to-orange-100 text-yellow-600' },
                { type: 'sad', active: 'from-blue-100 to-indigo-100 text-blue-600' },
                { type: 'fire', active: 'from-orange-100 to-red-100 text-red-600' }
            ];
            
            const inactiveClass = 'bg-gray-100';
            const activeClassesBase = 'bg-gradient-to-r shadow-lg scale-105';

            reactionMap.forEach(r => {
                const count = reactionCounts[r.type] || 0;
                
                // Find the button using the onclick attribute
                const button = postContainer.querySelector(`[onclick="toggleSingleReaction('${postId}', '${r.type}')"]`);
                if (button) {
                    // 1. Update Count
                    const countSpan = button.querySelector('.reaction-count');
                    if (countSpan) {
                        countSpan.textContent = count;
                    }

                    // 2. Update Style (Active/Inactive)
                    // Remove all specific active classes first
                    button.classList.remove('from-pink-200', 'to-red-200', 'text-red-600', 'from-red-100', 'to-pink-100', 'text-pink-600', 'from-yellow-100', 'to-orange-100', 'text-yellow-600', 'from-blue-100', 'to-indigo-100', 'text-blue-600', 'from-orange-100', 'to-red-100');
                    button.classList.remove('bg-gradient-to-r', 'shadow-lg', 'scale-105');
                    button.classList.add(inactiveClass); // Default to inactive
                    
                    if (myReaction === r.type) {
                        button.classList.remove(inactiveClass);
                        button.classList.add(...activeClassesBase.split(' '));
                        button.classList.add(...r.active.split(' '));
                    }
                }
            });
        }
        
        // 🔥 NEW: Function to set up real-time listeners for reactions
        function setupPostReactionListener(postId) {
            if (!currentUser) return;

            let currentReactionCounts = {};
            let currentUserReaction = null;

            // Listener for Counts
            const countsRef = postsRef.child(postId).child('reactionCounts');
            countsRef.on('value', countsSnap => {
                currentReactionCounts = countsSnap.val() || {};
                updateReactionDOM(postId, currentReactionCounts, currentUserReaction);
            });

            // Listener for Current User's Reaction
            const userReactionRef = postsRef.child(postId).child('reactions').child(currentUser.uid);
            userReactionRef.on('value', reactionSnap => {
                currentUserReaction = reactionSnap.val();
                // Fetch counts one last time or rely on the other listener to fire (for robustness, we rely on the two listeners)
                updateReactionDOM(postId, currentReactionCounts, currentUserReaction);
            });
        }
        
        // 🔥 MODIFIED: loadPostAndComments to call the new listener
        function loadPostAndComments(postId) {
            const postContainer = document.getElementById('mainPostContent');

            // Load main post details
            postsRef.child(postId).once('value', snapshot => {
                const post = snapshot.val();
                
                if (!post) {
                    postContainer.innerHTML = '<p class="text-red-500 text-center text-xl font-bold">පෝස්ට් එක සොයාගත නොහැක 😔</p>';
                    return;
                }

                currentPostAuthorId = post.authorId; 
                
                // --- Get INITIAL Reaction Data for first render ---
                const reactionCounts = post.reactionCounts || {};
                const reactions = post.reactions || {};
                const myReaction = currentUser ? (reactions[currentUser.uid] || null) : null;
                
                const heartCount = reactionCounts.heart || 0;
                const likeCount = reactionCounts.like || 0;
                const laughCount = reactionCounts.laugh || 0;
                const sadCount = reactionCounts.sad || 0;
                const fireCount = reactionCounts.fire || 0;
                const commentsCount = post.commentsCount || 0;
                // --------------------------

                // Display post content and reactions HTML (Initial state)
                postContainer.innerHTML = `
                    <div class="flex items-start space-x-4 mb-4">
                        <div class="w-10 h-10 bg-gradient-to-br from-purple-400 to-pink-400 rounded-full flex items-center justify-center text-xl shadow-xl shrink-0">
                            ${post.avatar || '👤'}
                        </div>
                        <div>
                            <p class="font-bold text-lg text-gray-800">${post.author || 'නොදන්නා පරිශීලකයෙක්'}</p>
                            <p class="text-xs text-gray-500">${getTimeAgo(post.timestamp)}</p>
                        </div>
                    </div>
                    <p class="text-lg text-gray-700 whitespace-pre-line pl-14 mb-4">${post.content || ''}</p>
                    
                    <div class="flex items-center justify-start border-t border-gray-100 pt-3 mt-3">
                        <div class="flex flex-wrap gap-2"> 
                            
                            <button onclick="toggleSingleReaction('${postId}', 'heart')" class="reaction-btn flex items-center space-x-1 px-2 py-1.5 sm:px-3 sm:py-2 rounded-xl sm:rounded-xl hover:bg-gradient-to-r hover:from-red-100 hover:to-pink-100 text-gray-700 transition-all duration-300 hover:scale-110 text-xs sm:text-sm ${myReaction === 'heart' ? 'bg-gradient-to-r from-pink-200 to-red-200 text-red-600 shadow-lg scale-105' : 'bg-gray-100'}">
                                <span class="text-lg sm:text-xl">❤️</span>
                                <span class="reaction-count font-bold text-sm">${heartCount}</span>
                            </button>
                            
                            <button onclick="toggleSingleReaction('${postId}', 'like')" class="reaction-btn flex items-center space-x-1 px-2 py-1.5 sm:px-3 sm:py-2 rounded-xl sm:rounded-xl hover:bg-gradient-to-r hover:from-red-50 hover:to-pink-50 text-gray-700 transition-all duration-300 hover:scale-110 text-xs sm:text-sm ${myReaction === 'like' ? 'bg-gradient-to-r from-red-100 to-pink-100 text-pink-600 shadow-lg scale-105' : 'bg-gray-100'}">
                                <span class="text-lg sm:text-xl">👍</span> 
                                <span class="reaction-count font-bold text-sm">${likeCount}</span>
                            </button>
                            
                            <button onclick="toggleSingleReaction('${postId}', 'laugh')" class="reaction-btn flex items-center space-x-1 px-2 py-1.5 sm:px-3 sm:py-2 rounded-xl sm:rounded-xl hover:bg-gradient-to-r hover:from-yellow-50 hover:to-orange-50 text-gray-700 transition-all duration-300 hover:scale-110 text-xs sm:text-sm ${myReaction === 'laugh' ? 'bg-gradient-to-r from-yellow-100 to-orange-100 text-yellow-600 shadow-lg scale-105' : 'bg-gray-100'}">
                                <span class="text-lg sm:text-xl">😂</span> 
                                <span class="reaction-count font-bold text-sm">${laughCount}</span>
                            </button>

                            <button onclick="toggleSingleReaction('${postId}', 'sad')" class="reaction-btn flex items-center space-x-1 px-2 py-1.5 sm:px-3 sm:py-2 rounded-xl sm:rounded-xl hover:bg-gradient-to-r hover:from-blue-50 hover:to-indigo-50 text-gray-700 transition-all duration-300 hover:scale-110 text-xs sm:text-sm ${myReaction === 'sad' ? 'bg-gradient-to-r from-blue-100 to-indigo-100 text-blue-600 shadow-lg scale-105' : 'bg-gray-100'}">
                                <span class="text-lg sm:text-xl">😢</span>
                                <span class="reaction-count font-bold text-sm">${sadCount}</span>
                            </button>

                            <button onclick="toggleSingleReaction('${postId}', 'fire')" class="reaction-btn flex items-center space-x-1 px-2 py-1.5 sm:px-3 sm:py-2 rounded-xl sm:rounded-xl hover:bg-gradient-to-r hover:from-orange-50 hover:to-red-50 text-gray-700 transition-all duration-300 hover:scale-110 text-xs sm:text-sm ${myReaction === 'fire' ? 'bg-gradient-to-r from-orange-100 to-red-100 text-red-600 shadow-lg scale-105' : 'bg-gray-100'}">
                                <span class="text-lg sm:text-xl">🔥</span> 
                                <span class="reaction-count font-bold text-sm">${fireCount}</span>
                            </button>
                                                   </div>
                    </div>
                `;
                
                // 🔥 NEW: Setup real-time listeners for reactions
                setupPostReactionListener(postId);

                loadComments(postId);
            });
        }


        // ... (Other functions like createCommentElement, showCommentContextMenu, etc. are omitted for brevity, but remain the same) ...

        function createCommentElement(comment) {
            const commentDiv = document.createElement('div');
            commentDiv.className = 'comment-card bg-white/90 backdrop-blur-sm rounded-xl p-4 shadow-sm border border-gray-100 fade-in';
            commentDiv.id = `comment-${comment.key}`;
            
            const isAuthor = currentUser && comment.authorId === currentUser.uid;

            let editMark = '';
            if (comment.edited) {
                editMark = '<span class="text-xs ml-1 text-gray-400">(edited)</span>';
            }

            const displayAuthor = comment.author || comment.authorName || 'පරිශීලකයා';

            commentDiv.innerHTML = `
                <div class="flex items-center space-x-3 mb-2">
                    <div class="w-8 h-8 bg-gradient-to-br from-pink-300 to-purple-300 rounded-full flex items-center justify-center text-lg shadow-lg shrink-0">
                        ${comment.avatar}
                    </div>
                    <div>
                        <p class="font-semibold text-gray-800">${displayAuthor}</p>
                        <p class="text-xs text-gray-500">${getTimeAgo(comment.timestamp)} ${editMark}</p>
                    </div>
                    ${isAuthor ? '<span class="text-xs text-purple-500 ml-auto font-medium">You</span>' : ''}
                </div>
                <p class="text-gray-700 ml-11 whitespace-pre-line comment-content">${comment.content}</p>
            `;
            
            if (isAuthor) {
                commentDiv.classList.add('cursor-pointer'); 
                commentDiv.addEventListener('contextmenu', (e) => showCommentContextMenu(comment.key, e));
                
                commentDiv.addEventListener('click', (e) => { 
                    if (window.innerWidth < 768) {
                        e.preventDefault(); 
                        showCommentContextMenu(comment.key, e);
                    }
                });
            }

            return commentDiv;
        }

        function showCommentContextMenu(commentKey, event) {
            event.preventDefault(); 
            
            editingCommentKey = commentKey;
            const menu = document.getElementById('comment-context-menu');
            
            menu.style.top = `${event.clientY}px`;
            menu.style.left = `${event.clientX}px`;
            menu.classList.remove('hidden');

            document.removeEventListener('click', hideContextMenu); 
            document.addEventListener('click', hideContextMenu, { once: true });
        }
        
        function hideContextMenu() {
            document.getElementById('comment-context-menu').classList.add('hidden');
        }

        function editCommentAction() {
            if (!editingCommentKey) return;
            
            const commentEl = document.getElementById(`comment-${editingCommentKey}`);
            const currentText = commentEl.querySelector('.comment-content').textContent;

            const inputEl = document.getElementById('commentInput');
            const buttonEl = document.getElementById('commentButton');

            inputEl.value = currentText.trim();
            buttonEl.innerHTML = '<span>💾 Save Edit</span>';
            isEditingComment = true;
            hideContextMenu();
            inputEl.focus();
            
            showNotification("සංස්කරණ මාදිලියට මාරු විය.");
        }

        function deleteCommentAction() {
            if (editingCommentKey) {
                if (confirm("ඔබට මෙම කමෙන්ටුව මැකීමට අවශ්‍යද?")) {
                    const commentRef = postsRef.child(currentPostId).child('comments').child(editingCommentKey);
                    
                    commentRef.remove()
                        .then(() => {
                            postsRef.child(currentPostId).child('commentsCount').transaction(count => {
                                return (count > 0) ? count - 1 : 0;
                            });
                            showNotification("කමෙන්ටුව මැකුවා! 🗑️");
                        })
                        .catch(error => {
                            console.error("Delete error:", error);
                            showNotification("කමෙන්ටුව මැකීමේ දෝෂයක්. ❌");
                        });
                }
            }
            resetInputMode();
            hideContextMenu();
        }

        function resetInputMode() {
            document.getElementById('commentInput').value = '';
            document.getElementById('commentButton').innerHTML = `💬 කමෙන්ට් කරන්න`;
            isEditingComment = false;
            editingCommentKey = null;
        }

        function loadComments(postId) {
            const commentsRef = postsRef.child(postId).child('comments');
            const commentsFeed = document.getElementById('commentsFeed');
            const noCommentsMessage = document.getElementById('noCommentsMessage');
            
            commentsFeed.innerHTML = '';
            noCommentsMessage.style.display = 'none';

            commentsRef.on('value', snapshot => {
                commentsFeed.innerHTML = '';
                if (!snapshot.exists()) {
                    noCommentsMessage.style.display = 'block';
                    return;
                }
                
                noCommentsMessage.style.display = 'none';

                const commentsData = [];
                snapshot.forEach(s => {
                    commentsData.push({ key: s.key, ...s.val() });
                });
                
                commentsData.reverse(); 

                const userPromises = commentsData.map(comment => 
                    usersRef.child(comment.authorId).once('value')
                );

                Promise.all(userPromises).then(userSnaps => {
                    commentsFeed.innerHTML = ''; 
                    
                    commentsData.forEach((comment, index) => {
                        const userData = userSnaps[index].val();
                        comment.author = userData ? userData.name : comment.author; 
                        comment.avatar = userData ? userData.avatar : comment.avatar;
                        
                        const commentElement = createCommentElement(comment);
                        commentsFeed.appendChild(commentElement);
                    });
                });
            });
        }

        function handleCommentSubmission() {
            if (!currentUser) {
                showNotification("කමෙන්ට් කිරීමට පිවිසෙන්න.");
                return;
            }

            const commentInput = document.getElementById('commentInput');
            const commentButton = document.getElementById('commentButton');
            const commentText = commentInput.value.trim();

            if (!commentText) {
                showNotification("කරුණාකර කමෙන්ටුවක් ලියන්න.");
                return;
            }

            commentButton.disabled = true;
            commentButton.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Sending...</span>`;

            if (isEditingComment && editingCommentKey) {
                 // --- EDIT LOGIC ---
                 const commentRef = postsRef.child(currentPostId).child('comments').child(editingCommentKey);
                 commentRef.update({
                    content: commentText,
                    edited: true,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                 }).then(() => {
                    showNotification("කමෙන්ටුව සංස්කරණය කරන ලදි. ✏️");
                    resetInputMode();
                    commentButton.disabled = false;
                    commentButton.innerHTML = `💬 කමෙන්ට් කරන්න`;
                 }).catch(error => {
                    console.error("Edit error:", error);
                    showNotification("සංස්කරණ දෝෂයක්. ❌");
                    commentButton.disabled = false;
                    commentButton.innerHTML = `💾 Save Edit`; 
                 });
                 return;
            }

            // --- NEW COMMENT LOGIC ---
            usersRef.child(currentUser.uid).once('value') 
                .then(snap => {
                    const userData = snap.val() || {};
                    const authorName = userData.name || 'පරිශීලකයා';

                    const commentData = {
                        author: authorName, 
                        authorName: authorName, 
                        authorId: currentUser.uid,
                        avatar: userData.avatar || '👤',
                        content: commentText,
                        timestamp: firebase.database.ServerValue.TIMESTAMP,
                        edited: false,
                        postId: currentPostId 
                    };

                    const commentsRef = postsRef.child(currentPostId).child('comments');
                    
                    return commentsRef.push(commentData)
                        .then(() => {
                            postsRef.child(currentPostId).child('commentsCount').transaction(count => (count || 0) + 1);

                            showNotification("කමෙන්ටුව සාර්ථකයි! 🎉");
                            commentInput.value = '';
                            
                            createNotification('comment', currentPostAuthorId, currentPostId, commentText); 
                        });
                })
                .then(() => {
                    commentButton.disabled = false;
                    commentButton.innerHTML = `💬 කමෙන්ට් කරන්න`;
                })
                .catch((error) => {
                    console.error('Error in comment submission flow:', error);
                    commentButton.disabled = false;
                    commentButton.innerHTML = `💬 කමෙන්ට් කරන්න`;
                    showNotification("කමෙන්ට් කිරීමේ දෝෂයක් ❌");
                });
        }

        // Time Ago Utility
        function getTimeAgo(timestamp) {
            if (!timestamp) return 'දැන්';
            const now = Date.now();
            const diff = now - timestamp;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days} දින${days > 1 ? '' : 'කට'} පෙර`;
            if (hours > 0) return `${hours} පැය${hours > 1 ? '' : 'කට'} පෙර`;
            if (minutes > 0) return `${minutes} මිනිත්තු${minutes > 1 ? '' : 'කට'} පෙර`;
            return 'දැන්';
        }

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();

            document.getElementById('edit-comment-btn').addEventListener('click', editCommentAction);
            document.getElementById('delete-comment-btn').addEventListener('click', deleteCommentAction);

            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                } else {
                    window.location.replace("index.html");
                    return;
                }
                
                const urlParams = new URLSearchParams(window.location.search);
                const postId = urlParams.get('postId');
                
                if (postId) {
                    currentPostId = postId;
                    loadPostAndComments(postId);
                } else {
                    document.getElementById('mainPostContent').innerHTML = '<p class="text-red-500 text-center text-xl font-bold">පෝස්ට් ID එකක් සොයාගත නොහැක.</p>';
                }
            });
        });

    </script>
</body>
</html>
